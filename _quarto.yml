project:
  type: book
  output-dir: _book
  preview:
    port: 4200

site-url: https://aimslab.stanford.edu/textbook/

resources:
  - "*.pdf"
  - "resources/brand/*"
  - "resources/fonts/*.txt"
  - "src/data/*.json"
  - "animations/**/*_narrated.mp4"
  
reference-location: document # footnotes in margin
citation-location: document # citations in margin
link-citations: true       # citations link to references

bibliography: references.bib
reference-section-title: References

crossref:
  fig-prefix: Figure
  tbl-prefix: Table
  sec-prefix: Section

language:
  crossref-ch-prefix: Chapter
  crossref-apx-prefix: Appendix

df-print: kable
filters:
  - pseudocode

format:
  html:
    toc-expand: 2
    title-block-banner: true
    theme: [flatly, resources/scss/global.scss]
    template-partials:
      - resources/html/title-block.html
      - resources/html/title-metadata.html
    published-title: "Updated"
    code-fold: false
    code-overflow: scroll
    code-line-numbers: true
    code-tools: false
    code-copy: True
    mathjax: 
      macros:
        mathbbm: ["\\mathbbm{#1}", 1]
    include-in-header:
      text: |
        <script>
        MathJax = {
          loader: {
            load: ['[tex]/boldsymbol']
          },
          tex: {
            tags: "all",
            inlineMath: [['$','$'], ['\\(','\\)']],
            displayMath: [['$$','$$'], ['\\[','\\]']],
            processEscapes: true,
            processEnvironments: true,
            packages: {
              '[+]': ['boldsymbol']
            }
          }
        };
        </script>
        <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml-full.js" type="text/javascript"></script>
    include-after-body: resources/html/aims-footer.html

  pdf:
    documentclass: scrreprt
    classoption: [numbers=noenddot,DIV=11]
    keep-tex: true
    include-in-header: resources/tex/preamble.tex
    include-after-body: resources/tex/postamble.tex
    template-partials:
      - resources/tex/partials/before-body.tex
    citeproc: true # use Pandoc's built-in citation processing
    toc-depth: 2 # level 1 headings (i.e. chapters)
    toc-title: Table of Contents # title of table of contents
    links-as-notes: true # turn URLs into sidenotes
    citecolor: DarkGreen # tufte color
    linkcolor: DarkBlue # tufte color
    urlcolor: DarkGreen # tufte color
    code-overflow: wrap
    code-line-numbers: true
    include-before-body:
      text: |
        \RecustomVerbatimEnvironment{verbatim}{Verbatim}{
          showspaces = false,
          showtabs = false,
          breaksymbolleft={},
          breaklines
        }
        \numberwithin{algorithm}{chapter}
        \algrenewcommand{\algorithmiccomment}[1]{\hskip3em$\rightarrow$ #1}


knitr:
  opts_chunk:
    comment: "#>"
    collapse: TRUE
    cache.lazy: FALSE
    dev: "png"
    dpi: 300

execute:
  freeze: auto
  eval: false
  echo: true
  message: false
  warning: false
  error: false
  cache: false
  highlight-style: github
  tidy: true

book:
  title: "AI Measurement Science"
  favicon: resources/brand/aims-icon.svg
  search:
    location: navbar
    type: overlay
  author:
    - name: Sang T. Truong
      url: https://ai.stanford.edu/~sttruong/
      orcid: 0000-0002-7551-4378
    - name: Sanmi Koyejo
      url: https://cs.stanford.edu/~sanmi/
      orcid: 0000-0001-9039-3220
    
  date: last-modified
  navbar:
    logo: resources/brand/aims-lockup.svg
    logo-alt: "AIMS — AI Measurement Science at Stanford"
    logo-href: https://aimslab.stanford.edu/
    background: "#ffffff"
    foreground: "#0d0f0f"
    collapse-below: lg
    toggle-position: right
    tools-collapse: true
    right:
      - text: "Research"
        href: https://aimslab.stanford.edu/research
      - text: "Data & Software"
        href: https://aimslab.stanford.edu/measurement-db
      - text: "Education"
        menu:
          - text: "Textbook"
            href: index.qmd
          - text: "Course"
            href: https://aimslab.stanford.edu/cs321m
      - text: "Community"
        menu:
          - text: "Competition"
            href: https://aimslab.stanford.edu/competition
          - text: "Workshop"
            href: https://aimslab.stanford.edu/workshop
          - text: "Seminars"
            href: https://aimslab.stanford.edu/seminars
      - text: "Blog"
        href: https://aimslab.stanford.edu/blog
  sidebar:
    title: "Textbook"
    logo: false
    logo-href: index.qmd
    style: "docked"
    border: true
    collapse-level: 1
  # google-analytics:
  # cookie-consent: true
  chapters:
    - index.qmd
    - src/chap1.qmd  # Validity
    - src/chap2.qmd  # Data
    - src/chap3.qmd  # Models
    - src/chap4.qmd  # Learning
    - src/chap5.qmd  # Reliability
    - src/chap6.qmd  # Efficiency
    - src/chap7.qmd  # Discovery
    - src/chap8.qmd  # Predictability
    - src/chap9.qmd  # Intervention
    - src/chap10.qmd # Ecosystem
    - src/chap11.qmd # Design
    - src/chap12.qmd # Application
    - src/chap13.qmd # Conclusion
  appendices:
    - src/notation.qmd
